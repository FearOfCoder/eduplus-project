<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title != null ? title + ' - EduPlus' : 'EduPlus'}">EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow-1">
        <div th:replace="${content}"></div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/notifications.js}"></script>
    <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const userRole = /*[[${currentUser != null and currentUser.role != null ? currentUser.role.name() : ''}]]*/ '';

        if (urlParams.has('loginSuccess')) {
            let title = "Xin chào!";
            let msg = "Mừng bạn quay trở lại.";

            if (userRole === 'ADMIN') {
                title = "Xin chào Quản trị viên!";
                msg = "Chúc bạn làm việc hiệu quả.";
            } else if (userRole === 'TEACHER') {
                title = "Xin chào Thầy/Cô!";
                msg = "Chúc bạn có những bài giảng tuyệt vời.";
            } else if (userRole === 'STUDENT') {
                title = "Chào bạn!";
                msg = "Chúc bạn học tập thật tốt nhé.";
            }

            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: title,
                text: msg,
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
            });
            window.history.replaceState(null, null, window.location.pathname);
        }

        if (urlParams.has('logout')) {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'info',
                title: 'Đăng xuất thành công',
                showConfirmButton: false,
                timer: 3000
            });
            window.history.replaceState(null, null, window.location.pathname);
        }
    });
    </script>
</body>
</html>
