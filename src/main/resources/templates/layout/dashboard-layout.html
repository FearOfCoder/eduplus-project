<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title != null ? title + ' - EduPlus' : 'EduPlus'}">EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div class="d-flex min-vh-100 overflow-hidden">
        <nav id="sidebar" class="text-white d-flex flex-column flex-shrink-0 p-3 dashboard-sidebar">
            <a th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')"
               class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4 fw-bold"><i class="fas fa-graduation-cap me-2 text-primary"></i>EduPlus</span>
            </a>
            <a th:href="@{/teacher/dashboard}" sec:authorize="hasRole('TEACHER')"
               class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4 fw-bold"><i class="fas fa-graduation-cap me-2 text-primary"></i>EduPlus</span>
            </a>
            <a th:href="@{/}" sec:authorize="!hasRole('ADMIN') and !hasRole('TEACHER')"
               class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <span class="fs-4 fw-bold"><i class="fas fa-graduation-cap me-2 text-primary"></i>EduPlus</span>
            </a>
            <hr class="text-white-50 my-2">
            <ul class="nav nav-pills flex-column mb-auto">
                <div sec:authorize="hasRole('ADMIN')" th:replace="~{fragments/sidebar-admin :: sidebar-content}"></div>
                <div sec:authorize="hasRole('TEACHER')" th:replace="~{fragments/sidebar-teacher :: sidebar-content}"></div>
            </ul>
            <hr class="text-white-50 my-2">
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                    <img th:if="${currentUser != null and currentUser.avatar != null and !currentUser.avatar.isEmpty()}"
                         th:src="${currentUser.avatar}" alt="Avatar" width="32" height="32" class="rounded-circle me-2">
                    <span th:unless="${currentUser != null and currentUser.avatar != null and !currentUser.avatar.isEmpty()}"
                          class="rounded-circle bg-primary d-inline-flex align-items-center justify-content-center me-2 text-white flex-shrink-0" style="width:32px;height:32px;">
                        <i class="fas fa-user small"></i>
                    </span>
                    <strong class="d-none d-lg-inline text-truncate" style="max-width: 160px;"
                           th:text="${currentUser != null ? currentUser.fullName : #authentication.principal?.fullName != null ? #authentication.principal.fullName : #authentication.name}">User Name</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                    <li><a class="dropdown-item" th:href="@{/profile}"><i class="fas fa-user-circle me-2"></i>Hồ sơ</a></li>
                    <li><a class="dropdown-item" th:href="@{/profile}"><i class="fas fa-key me-2"></i>Đổi mật khẩu</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="dropdown-item text-danger border-0 bg-transparent w-100 text-start">
                                <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </nav>
        <main class="flex-grow-1 bg-light overflow-auto dashboard-main">
            <div class="container-fluid p-4">
                <div th:replace="${content}"></div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/notifications.js}"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('.dashboard-sidebar .nav-link');

        let bestMatchLink = null;
        let bestMatchLength = 0;

        navLinks.forEach(link => {
            link.classList.remove('bg-gradient-brand', 'shadow-sm', 'active', 'fw-bold', 'text-muted');
            link.classList.add('bg-transparent', 'text-white');
            link.style.opacity = "0.9";

            const href = link.getAttribute('href');
            if (href && href !== '#' && href !== '/') {
                try {
                    const linkPath = new URL(href, window.location.origin).pathname;
                    if (currentPath === linkPath || currentPath.startsWith(linkPath + '/')) {
                        if (linkPath.length > bestMatchLength) {
                            bestMatchLength = linkPath.length;
                            bestMatchLink = link;
                        }
                    }
                } catch (e) {}
            }
        });

        if (bestMatchLink) {
            bestMatchLink.classList.remove('bg-transparent');
            bestMatchLink.classList.add('bg-gradient-brand', 'shadow-sm', 'active', 'fw-bold');
            bestMatchLink.style.opacity = "1";
        }
    });
    </script>
    <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const urlParams = new URLSearchParams(window.location.search);
        const userRole = /*[[${currentUser != null and currentUser.role != null ? currentUser.role.name() : ''}]]*/ '';

        if (urlParams.has('loginSuccess')) {
            let title = "Xin chào!";
            let msg = "Mừng bạn quay trở lại.";

            if (userRole === 'ADMIN') {
                title = "Xin chào Quản trị viên!";
                msg = "Chúc bạn làm việc hiệu quả.";
            } else if (userRole === 'TEACHER') {
                title = "Xin chào Thầy/Cô!";
                msg = "Chúc bạn có những bài giảng tuyệt vời.";
            } else if (userRole === 'STUDENT') {
                title = "Chào bạn!";
                msg = "Chúc bạn học tập thật tốt nhé.";
            }

            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'success',
                title: title,
                text: msg,
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true
            });
            window.history.replaceState(null, null, window.location.pathname);
        }

        if (urlParams.has('logout')) {
            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: 'info',
                title: 'Đăng xuất thành công',
                showConfirmButton: false,
                timer: 3000
            });
            window.history.replaceState(null, null, window.location.pathname);
        }
    });
    </script>
</body>
</html>
