<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trung tâm Trợ giúp - EduPlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Hero -->
    <section class="bg-gradient-brand text-white py-5">
        <div class="container py-4 text-center">
            <h1 class="h2 fw-bold mb-3">Xin chào, chúng tôi có thể giúp gì cho bạn?</h1>
            <p class="mb-0 opacity-90">Tìm câu trả lời nhanh trong các câu hỏi thường gặp bên dưới.</p>
        </div>
    </section>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-brand">Bạn cần hỗ trợ gì?</h2>
            <p class="text-muted">Tìm câu trả lời nhanh cho các vấn đề thường gặp.</p>
        </div>
        <div class="row g-4">
            <div class="col-lg-6" th:each="cat : ${categories}">
                <div class="card bg-white border-0 shadow-sm rounded-4 h-100 p-4">
                    <h5 class="fw-bold mb-4 text-brand">
                        <i th:class="${cat.icon} + ' me-2'"></i><span th:text="${cat.name}"></span>
                    </h5>
                    <div class="accordion accordion-flush" th:id="'faqAccordion' + ${cat.id}">
                        <div class="accordion-item bg-transparent border-0 mb-2" th:each="faq : ${cat.faqs}">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed bg-light rounded-3 shadow-none fw-bold" type="button" data-bs-toggle="collapse"
                                        th:data-bs-target="'#collapse' + ${faq.id}"
                                        th:aria-controls="'collapse' + ${faq.id}"
                                        th:id="'btn' + ${faq.id}">
                                    <i class="fas fa-caret-right me-2 text-muted"></i> <span th:text="${faq.question}"></span>
                                </button>
                            </h2>
                            <div th:id="'collapse' + ${faq.id}" class="accordion-collapse collapse"
                                 th:attr="data-bs-parent='#faqAccordion' + ${cat.id}"
                                 th:aria-labelledby="'btn' + ${faq.id}">
                                <div class="accordion-body text-muted pt-2 pb-3 ps-4" style="white-space: pre-wrap;" th:text="${faq.answer}"></div>
                            </div>
                        </div>
                    </div>
                    <div th:if="${cat.faqs == null || cat.faqs.isEmpty()}" class="text-muted small">Chưa có câu hỏi trong danh mục này.</div>
                </div>
            </div>
        </div>
        <div th:if="${categories == null || #lists.isEmpty(categories)}" class="text-center py-5">
            <i class="fas fa-info-circle fa-3x text-muted mb-3"></i>
            <p class="text-muted mb-0">Chưa có nội dung trợ giúp. Vui lòng quay lại sau.</p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
