<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- Sidebar Teacher: menu dọc, nền tối, full chiều cao -->
    <div th:fragment="sidebar" class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark h-100" style="min-height: 100%;">
        <a th:href="@{/teacher/dashboard}" class="d-flex align-items-center mb-4 text-decoration-none px-2 pt-2">
            <img th:src="${siteLogo}" alt="EduPlus" style="height: 50px; width: auto; object-fit: contain;" class="me-2 bg-white rounded-3 p-1">
            <span class="fs-4 fw-bold text-white" style="letter-spacing: -0.5px;">EduPlus</span>
        </a>
        <div class="mb-3">
            <span class="small fw-semibold text-white-50 d-block">GIẢNG VIÊN</span>
        </div>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/teacher/dashboard}"><i class="fas fa-chart-line me-2"></i>Doanh thu</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/teacher/finance}"><i class="fas fa-money-check-alt me-2"></i>Tài chính</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/teacher/courses}"><i class="fas fa-book me-2"></i>Khóa học</a></li>
            <li class="nav-item"><a class="nav-link text-white" th:href="@{/teacher/all-submissions}"><i class="fas fa-clipboard-list me-2"></i>Bài nộp</a></li>
            <li class="nav-item">
                <a th:if="${currentUser != null and currentUser.status != null and currentUser.status.name() == 'PENDING'}"
                   class="nav-link disabled text-muted" href="#" title="Tài khoản đang chờ duyệt"><i class="fas fa-lock me-2"></i><i class="fas fa-plus-circle me-2"></i>Tạo khóa học</a>
                <a th:unless="${currentUser != null and currentUser.status != null and currentUser.status.name() == 'PENDING'}"
                   class="nav-link text-white" th:href="@{/teacher/courses/new}"><i class="fas fa-plus-circle me-2"></i>Tạo khóa học</a>
            </li>
        </ul>
    </div>
    <!-- Chỉ nội dung menu (dùng trong dashboard-layout) -->
    <th:block th:fragment="sidebar-content">
        <li class="nav-item"><a class="nav-link text-white py-2 px-3 rounded-3" th:href="@{/teacher/dashboard}"><i class="fas fa-chart-line me-2"></i>Doanh thu</a></li>
        <li class="nav-item"><a class="nav-link text-white py-2 px-3 rounded-3" th:href="@{/teacher/finance}"><i class="fas fa-money-check-alt me-2"></i>Tài chính</a></li>
        <li class="nav-item"><a class="nav-link text-white py-2 px-3 rounded-3" th:href="@{/teacher/courses}"><i class="fas fa-book me-2"></i>Khóa học</a></li>
        <li class="nav-item"><a class="nav-link text-white py-2 px-3 rounded-3" th:href="@{/teacher/all-submissions}"><i class="fas fa-clipboard-list me-2"></i>Bài nộp</a></li>
        <li class="nav-item">
            <a th:if="${currentUser != null and currentUser.status != null and currentUser.status.name() == 'PENDING'}"
               class="nav-link disabled text-muted py-2 px-3 rounded-3" href="#" title="Tài khoản đang chờ duyệt"><i class="fas fa-lock me-2"></i><i class="fas fa-plus-circle me-2"></i>Tạo khóa học</a>
            <a th:unless="${currentUser != null and currentUser.status != null and currentUser.status.name() == 'PENDING'}"
               class="nav-link text-white py-2 px-3 rounded-3" th:href="@{/teacher/courses/new}"><i class="fas fa-plus-circle me-2"></i>Tạo khóa học</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white py-2 px-3 rounded-3 d-flex justify-content-between align-items-center" href="#notificationCollapse"
               data-bs-toggle="collapse" role="button" aria-expanded="false" aria-controls="notificationCollapse"
               id="btn-load-notif">
                <span><i class="fas fa-bell me-2"></i>Thông báo</span>
                <span id="sidebar-notif-badge" class="badge bg-danger rounded-pill d-none" style="font-size: 0.65rem; min-width: 1.25rem;">0</span>
            </a>
            <div class="collapse" id="notificationCollapse">
                <div class="sidebar-notif-list-wrap rounded mt-1 p-0 overflow-hidden" id="sidebar-notif-list"
                     style="max-height: 300px; overflow-y: auto; overflow-x: hidden; background: rgba(0,0,0,0.3);">
                    <div class="p-3 text-center text-white-50 small">Đang tải...</div>
                </div>
            </div>
        </li>
    </th:block>
</body>
</html>
