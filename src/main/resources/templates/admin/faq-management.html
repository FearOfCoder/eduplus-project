<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/dashboard-layout :: layout('Quản lý Trợ giúp', ~{::content})}">
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
            <h1 class="h4 fw-bold mb-0"><i class="fas fa-life-ring me-2"></i>Quản lý Trợ giúp (FAQ)</h1>
            <div class="d-flex gap-2">
                <a th:href="@{/admin/faq/categories}" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                    <i class="fas fa-folder-tree me-2"></i>Quản lý Danh mục
                </a>
                <button type="button" id="btnAddFaq" class="btn bg-gradient-brand text-white rounded-pill px-4 py-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#faqModal" th:attr="data-action=@{/admin/faq}">
                    <i class="fas fa-plus me-2"></i>Thêm câu hỏi mới
                </button>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card table-card-edup border-0 rounded-4 shadow-sm">
            <div class="card-header py-3 border-0" style="background: #F8FAFC;">
                <h2 class="h5 mb-0 fw-bold">Danh sách câu hỏi thường gặp</h2>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Danh mục</th>
                                <th>Câu hỏi</th>
                                <th style="width: 180px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="f : ${faqs}">
                                <td th:text="${f.id}">1</td>
                                <td>
                                    <span class="badge rounded-pill bg-secondary" th:text="${f.category != null ? f.category.name : '—'}">—</span>
                                </td>
                                <td th:text="${#strings.abbreviate(f.question, 80)}">Câu hỏi...</td>
                                <td>
                                    <button type="button" class="btn btn-sm btn-outline-secondary me-1" data-bs-toggle="modal" data-bs-target="#viewFaqModal"
                                            th:attr="data-question=${f.question}, data-answer=${f.answer}" title="Xem chi tiết">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <a th:href="@{/admin/faq/{id}/edit(id=${f.id})}" class="btn btn-sm btn-outline-primary me-1" title="Sửa"><i class="fas fa-edit"></i></a>
                                    <form th:action="@{/admin/faq/{id}/delete(id=${f.id})}" method="post" class="d-inline" onsubmit="return confirm('Xóa câu hỏi này?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa"><i class="fas fa-trash-alt"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${faqs != null && #lists.isEmpty(faqs)}" class="p-4 text-muted text-center">Chưa có câu hỏi nào. Hãy thêm câu hỏi mới hoặc tạo danh mục trước.</div>
            </div>
        </div>

        <!-- Modal Xem chi tiết -->
        <div class="modal fade" id="viewFaqModal" tabindex="-1" aria-labelledby="viewFaqModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content border-0 rounded-4 shadow">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="viewFaqModalLabel">Chi tiết câu hỏi</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body pt-2">
                        <h4 class="fw-bold mb-3" id="viewFaqQuestion" style="color: var(--text-main);">—</h4>
                        <p class="text-muted mb-0" id="viewFaqAnswer" style="white-space: pre-wrap; line-height: 1.6;">—</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Thêm/Sửa -->
        <div class="modal fade" id="faqModal" tabindex="-1" aria-labelledby="faqModalTitle" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content border-0 rounded-4 shadow">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold" id="faqModalTitle">Thêm câu hỏi mới</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                    </div>
                    <div class="modal-body pt-2">
                        <form id="faqForm" th:action="${faq != null} ? @{/admin/faq/{id}(id=${faq.id})} : @{/admin/faq}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Danh mục</label>
                                <select name="categoryId" id="faqCategoryId" class="form-select" required>
                                    <option value="">-- Chọn danh mục --</option>
                                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${faq != null && faq.category != null && faq.category.id == c.id}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Câu hỏi</label>
                                <input type="text" name="question" id="faqQuestion" class="form-control" required maxlength="500" placeholder="Nhập câu hỏi" th:value="${faq != null ? faq.question : ''}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Câu trả lời</label>
                                <textarea name="answer" id="faqAnswer" class="form-control" rows="5" required placeholder="Nhập câu trả lời" th:text="${faq != null ? faq.answer : ''}"></textarea>
                            </div>
                            <div class="d-flex justify-content-end gap-2 mt-3">
                                <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn bg-gradient-brand text-white rounded-pill px-4"><i class="fas fa-save me-1"></i>Lưu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var viewModal = document.getElementById('viewFaqModal');
            if (viewModal) {
                viewModal.addEventListener('show.bs.modal', function(e) {
                    var btn = e.relatedTarget;
                    if (btn) {
                        document.getElementById('viewFaqQuestion').textContent = btn.getAttribute('data-question') || '—';
                        document.getElementById('viewFaqAnswer').textContent = btn.getAttribute('data-answer') || '—';
                    }
                });
            }
            var btnAdd = document.getElementById('btnAddFaq');
            if (btnAdd) {
                btnAdd.addEventListener('click', function() {
                    var form = document.getElementById('faqForm');
                    if (form) {
                        form.action = btnAdd.getAttribute('data-action') || '/admin/faq';
                        document.getElementById('faqQuestion').value = '';
                        document.getElementById('faqAnswer').value = '';
                        var sel = document.getElementById('faqCategoryId');
                        if (sel) sel.selectedIndex = 0;
                        document.getElementById('faqModalTitle').textContent = 'Thêm câu hỏi mới';
                    }
                });
            }
            var faqModal = document.getElementById('faqModal');
            if (faqModal && /*[[${faq != null}]]*/ false) {
                new bootstrap.Modal(faqModal).show();
            }
        });
        </script>
    </div>
</body>
</html>
