<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/dashboard-layout :: layout(${category.id != null ? 'Chỉnh sửa danh mục' : 'Thêm danh mục'}, ~{::content})}">
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h4 fw-bold mb-0" th:text="${category.id != null ? 'Chỉnh sửa danh mục' : 'Thêm danh mục mới'}">Danh mục</h1>
            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Quay lại</a>
        </div>
        <form th:action="@{/admin/categories/save}" method="post" class="card shadow-sm border-0">
            <div class="card-body">
                <input type="hidden" name="id" th:value="${category.id}">
                <div class="mb-3">
                    <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required th:value="${category.name}" placeholder="Ví dụ: CNTT & Lập trình">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea name="description" class="form-control" rows="2" placeholder="Mô tả ngắn (tùy chọn)" th:text="${category.description}"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Danh mục cha</label>
                    <select name="parentId" class="form-select">
                        <option value="">— Danh mục gốc (không cha) —</option>
                        <option th:each="p : ${parentCategories}" th:value="${p.id}" th:text="${p.name}" th:selected="${category.parent != null && category.parent.id == p.id}" th:disabled="${category.id != null && category.id == p.id}">Cha</option>
                    </select>
                    <div class="form-text">Để trống nếu đây là danh mục cấp cao (gốc).</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu</button>
                    <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Hủy</a>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
