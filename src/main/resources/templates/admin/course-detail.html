<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/dashboard-layout :: layout('Chi tiết khóa học', ~{::content})}">
<body>
    <div th:fragment="content">
        <div class="container-fluid py-4">
            <div class="card bg-white rounded-4 shadow-sm border-0 p-4">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                    <h4 class="fw-bold mb-0">Chi tiết khóa học</h4>
                    <a th:href="@{/admin/courses}" class="btn btn-light rounded-pill px-4"><i class="fas fa-arrow-left me-2"></i> Quay lại</a>
                </div>
                <div th:if="${course}" class="row">
                    <div class="col-md-4">
                        <img th:src="${course.imageUrl != null and !course.imageUrl.isEmpty() ? course.imageUrl : '/images/default-course.png'}" class="img-fluid rounded-3 mb-3 w-100" style="object-fit: cover; max-height: 250px;" alt="Khóa học" onerror="this.src='/images/default-course.png';">
                    </div>
                    <div class="col-md-8">
                        <h3 class="fw-bold text-brand" th:text="${course.title}">Tên khóa học</h3>
                        <p class="text-muted mb-2">Giảng viên: <strong th:text="${course.teacher != null ? course.teacher.fullName : '—'}">Tên GV</strong></p>
                        <p class="text-muted mb-4">Giá bán: <strong class="text-success fs-5" th:text="|${course.price != null ? #numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT') : '0'} ₫|">0 ₫</strong></p>

                        <h6 class="fw-bold mt-3 text-dark">Lời mở đầu:</h6>
                        <p class="text-muted fst-italic mb-3" th:text="${course.preface != null ? course.preface : 'Không có lời mở đầu.'}">Nội dung lời mở đầu...</p>

                        <h6 class="fw-bold">Mô tả khóa học:</h6>
                        <div class="bg-light p-3 rounded-3 text-muted mb-4" th:utext="${course.description}">Nội dung mô tả...</div>

                        <div class="d-flex gap-3" th:if="${course.status != null and course.status.name() == 'PENDING_REVIEW'}">
                            <form th:action="@{|/admin/courses/${course.id}/approve|}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-success rounded-pill px-4 py-2 fw-bold"><i class="fas fa-check me-2"></i> Phê duyệt Khóa học</button>
                            </form>
                            <form th:action="@{|/admin/courses/${course.id}/reject|}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-danger rounded-pill px-4 py-2 fw-bold"><i class="fas fa-times me-2"></i> Từ chối</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
