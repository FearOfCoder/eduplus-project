<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khóa học của tôi - EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">Xin chào, <span th:text="${student.fullName}">Student</span></h1>
    </div>

    <h2 class="h5 mb-3">Khóa học của tôi</h2>
    <div th:if="${#lists.isEmpty(enrollments)}" class="alert alert-info">
        Bạn chưa tham gia khóa học nào. Hãy vào trang <a th:href="@{/courses}">Danh sách khóa học</a> để mua khóa học.
    </div>
    <div th:if="${!#lists.isEmpty(enrollments)}" class="row g-3">
        <div class="col-md-6" th:each="enroll : ${enrollments}">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${enroll.course.title}">Tên khóa học</h5>
                    <p class="card-text text-muted" th:text="${enroll.course.description}">Mô tả</p>
                    <p class="mb-1">
                        Tiến độ: <strong th:text="${enroll.progressPercent + '%'}">0%</strong>
                    </p>
                    <p class="mb-0" th:text="${enroll.completed ? 'Trạng thái: Hoàn thành' : 'Trạng thái: Đang học'}">
                        Trạng thái
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
