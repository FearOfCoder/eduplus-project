<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bài tập của khóa học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-1" th:text="${course.title}">Tên khóa học</h1>
            <p class="mb-0 text-muted">Danh sách bài tập</p>
        </div>
        <div>
            <a th:href="@{/student/dashboard}" class="btn btn-outline-secondary btn-sm">Dashboard</a>
            <a th:href="@{/logout}" class="btn btn-danger btn-sm">Đăng xuất</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(assignments)}" class="alert alert-info">
        Khóa học hiện chưa có bài tập nào.
    </div>

    <div th:if="${!#lists.isEmpty(assignments)}" class="list-group">
        <a class="list-group-item list-group-item-action"
           th:each="a : ${assignments}"
           th:href="@{|/student/assignments/${a.id}|}">
            <div class="d-flex w-100 justify-content-between">
                <h5 class="mb-1" th:text="${a.title}">Tiêu đề bài tập</h5>
                <small th:text="${a.dueDate != null ? #temporals.format(a.dueDate, 'dd/MM/yyyy HH:mm') : 'Không giới hạn'}">
                    01/01/2026 12:00
                </small>
            </div>
            <p class="mb-1 text-muted" th:text="${#strings.abbreviate(a.description, 140)}">
                Mô tả ngắn về bài tập...
            </p>
        </a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
