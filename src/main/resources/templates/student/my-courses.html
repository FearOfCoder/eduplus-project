<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khóa học của tôi - EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 mb-0">Khóa học của tôi</h1>
    </div>

    <div th:if="${#lists.isEmpty(enrollments)}" class="alert alert-info">
        <h5 class="alert-heading">Bạn chưa có khóa học nào</h5>
        <p class="mb-0">Hãy vào trang <a th:href="@{/courses}" class="alert-link">Danh sách khóa học</a> để mua khóa học.</p>
    </div>

    <div th:if="${!#lists.isEmpty(enrollments)}" class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="enroll : ${enrollments}">
            <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
                <img th:src="${(enroll.course.imageUrl != null and !enroll.course.imageUrl.isEmpty()) ? enroll.course.imageUrl : '/images/default-course.png'}"
                     class="card-img-top"
                     alt="Ảnh bìa khóa học"
                     style="height: 180px; object-fit: cover; border-top-left-radius: 16px; border-top-right-radius: 16px;"
                     onerror="this.onerror=null; this.src='/images/default-course.png';">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${enroll.course.title}">Tên khóa học</h5>
                    <p class="card-text text-muted small" th:text="${#strings.abbreviate(enroll.course.description, 100)}">
                        Mô tả khóa học...
                    </p>
                    <div class="mb-2">
                        <small class="text-muted">Tiến độ:</small>
                        <div class="progress mt-1" style="height: 8px;">
                            <div class="progress-bar" role="progressbar" 
                                 th:styleappend="'width: ' + ${enroll.progressPercent} + '%'"
                                 th:attr="aria-valuenow=${enroll.progressPercent}"
                                 aria-valuemin="0" aria-valuemax="100">
                            </div>
                        </div>
                        <small class="text-muted" th:text="${enroll.progressPercent + '%'}">0%</small>
                    </div>
                    <p class="mb-2">
                        <span class="badge" th:classappend="${enroll.completed ? 'bg-success' : 'bg-primary'}"
                              th:text="${enroll.completed ? 'Hoàn thành' : 'Đang học'}">
                            Đang học
                        </span>
                    </p>
                    <div class="mt-auto">
                        <a th:href="@{|/student/course/${enroll.course.id}|}" 
                           class="btn bg-gradient-brand text-white w-100 rounded-pill fw-bold py-2">
                            <i class="fas fa-play-circle me-2"></i> Vào học ngay
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
