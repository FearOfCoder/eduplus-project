<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cửa hàng khóa học - EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <h1 class="h2 fw-bold mb-4" style="color: var(--text-main);">Cửa hàng khóa học</h1>

    <div class="row">
        <!-- Sidebar Bộ lọc -->
        <div class="col-lg-3 mb-4 filter-sidebar">
            <div class="card shadow-sm">
                <div class="card-header py-2 bg-gradient-brand">
                    <i class="fas fa-filter me-2"></i> Bộ lọc
                </div>
                <div class="card-body">
                    <!-- Tìm kiếm -->
                    <form method="get" action="#" th:action="@{/courses}" id="searchForm" class="mb-3">
                        <label class="form-label small fw-semibold">Tìm kiếm</label>
                        <div class="input-group">
                            <input type="text" name="keyword" class="form-control form-control-sm"
                                   placeholder="Nhập từ khóa..."
                                   th:value="${keyword}">
                            <input type="hidden" name="page" value="0">
                            <input type="hidden" name="categoryId" th:value="${selectedCategoryId}" th:if="${selectedCategoryId}">
                            <input type="hidden" name="minPrice" th:value="${minPrice}" th:if="${minPrice != null}">
                            <input type="hidden" name="maxPrice" th:value="${maxPrice}" th:if="${maxPrice != null}">
                            <input type="hidden" name="sort" th:value="${sort}" th:if="${sort}">
                            <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-search"></i> Tìm</button>
                        </div>
                    </form>

                    <!-- Danh mục - Accordion -->
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Danh mục</label>
                        <div class="accordion accordion-flush" id="categoryAccordion">
                            <div class="accordion-item border-start-0 border-end-0">
                                <h2 class="accordion-header">
                                    <a class="accordion-button collapsed py-2 bg-light" style="text-decoration: none; color: inherit;"
                                       th:href="@{/courses(page=0,keyword=${keyword},minPrice=${minPrice},maxPrice=${maxPrice},sort=${sort})}">Tất cả khóa học</a>
                                </h2>
                            </div>
                            <th:block th:each="root, iterStat : ${rootCategories}">
                                <div class="accordion-item border-start-0 border-end-0">
                                    <h2 class="accordion-header">
                                        <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse"
                                                th:data-bs-target="'#collapse' + ${root.id}" aria-expanded="false">
                                            <span th:text="${root.name}">Cha</span>
                                        </button>
                                    </h2>
                                    <div th:id="'collapse' + ${root.id}" class="accordion-collapse collapse">
                                        <div class="accordion-body py-1">
                                            <a th:href="@{/courses(page=0,categoryId=${root.id},keyword=${keyword},minPrice=${minPrice},maxPrice=${maxPrice},sort=${sort})}"
                                               class="d-block small py-1 text-primary"
                                               th:classappend="${selectedCategoryId == root.id} ? 'fw-bold' : ''">Tất cả <span th:text="${root.name}">Cha</span></a>
                                            <a th:each="child : ${root.children}"
                                               th:href="@{/courses(page=0,categoryId=${child.id},keyword=${keyword},minPrice=${minPrice},maxPrice=${maxPrice},sort=${sort})}"
                                               class="d-block small py-1 ps-3"
                                               th:classappend="${selectedCategoryId == child.id} ? 'fw-bold text-primary' : 'text-secondary'"
                                               th:text="${child.name}">Con</a>
                                        </div>
                                    </div>
                                </div>
                            </th:block>
                        </div>
                    </div>

                    <!-- Khoảng giá -->
                    <form method="get" action="#" th:action="@{/courses}" id="priceForm">
                        <label class="form-label small fw-semibold">Khoảng giá (VND)</label>
                        <input type="hidden" name="page" value="0">
                        <input type="hidden" name="keyword" th:value="${keyword}" th:if="${keyword}">
                        <input type="hidden" name="categoryId" th:value="${selectedCategoryId}" th:if="${selectedCategoryId}">
                        <input type="hidden" name="sort" th:value="${sort}" th:if="${sort}">
                        <div class="row g-1 mb-2">
                            <div class="col-6">
                                <input type="number" name="minPrice" class="form-control form-control-sm" placeholder="Từ" min="0" step="1000"
                                       th:value="${minPrice}">
                            </div>
                            <div class="col-6">
                                <input type="number" name="maxPrice" class="form-control form-control-sm" placeholder="Đến" min="0" step="1000"
                                       th:value="${maxPrice}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-outline-primary btn-sm w-100"><i class="fas fa-filter me-1"></i> Lọc</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Nội dung chính -->
        <div class="col-lg-9">
            <!-- Toolbar Sắp xếp -->
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <span class="text-muted small" th:text="${coursePage.totalElements} + ' khóa học'">0 khóa học</span>
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Sắp xếp theo
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" th:classappend="${sort == 'price_asc'} ? 'active' : ''"
                               th:href="@{/courses(page=0,keyword=${keyword},categoryId=${selectedCategoryId},minPrice=${minPrice},maxPrice=${maxPrice},sort='price_asc')}">Giá thấp → Cao</a></li>
                        <li><a class="dropdown-item" th:classappend="${sort == 'price_desc'} ? 'active' : ''"
                               th:href="@{/courses(page=0,keyword=${keyword},categoryId=${selectedCategoryId},minPrice=${minPrice},maxPrice=${maxPrice},sort='price_desc')}">Giá cao → Thấp</a></li>
                        <li><a class="dropdown-item" th:classappend="${sort == 'newest'} ? 'active' : ''"
                               th:href="@{/courses(page=0,keyword=${keyword},categoryId=${selectedCategoryId},minPrice=${minPrice},maxPrice=${maxPrice},sort='newest')}">Mới nhất</a></li>
                    </ul>
                </div>
            </div>

            <!-- Danh sách khóa học -->
            <div class="row g-4">
                <div class="col-md-6 col-xl-4" th:each="course : ${coursePage.content}">
                    <a th:href="@{|/course/${course.id}/intro|}" class="text-decoration-none text-dark">
                        <div class="card course-card-edup h-100">
                            <img th:src="${(course.imageUrl != null and !course.imageUrl.isEmpty()) ? course.imageUrl : '/images/default-course.png'}"
                                 class="card-img-top"
                                 alt="Hình ảnh khóa học"
                                 style="height: 180px;"
                                 onerror="this.onerror=null; this.src='/images/default-course.png';">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title h6" th:text="${course.title}">Tên khóa học</h5>
                                <p class="card-text text-muted small flex-grow-1" th:text="${#strings.abbreviate(course.description, 120)}">Mô tả</p>
                                <div class="mt-auto d-flex justify-content-between align-items-center">
                                    <span class="fw-bold price text-price" th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</span>
                                    <span class="btn btn-primary btn-sm">Tham gia khóa học</span>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
            <p th:if="${coursePage.empty}" class="text-muted mt-3">Không tìm thấy khóa học phù hợp.</p>

            <nav th:if="${coursePage.totalPages > 1}" aria-label="Page navigation" class="mt-5">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${coursePage.first ? 'disabled' : ''}">
                        <a class="page-link rounded-circle mx-1" th:href="@{/courses(page=${coursePage.number - 1}, keyword=${keyword}, categoryId=${selectedCategoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort=${sort})}" aria-label="Previous">
                            <i class="fas fa-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, coursePage.totalPages - 1)}" th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link rounded-circle mx-1 fw-bold shadow-sm" th:href="@{/courses(page=${i}, keyword=${keyword}, categoryId=${selectedCategoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort=${sort})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${coursePage.last ? 'disabled' : ''}">
                        <a class="page-link rounded-circle mx-1" th:href="@{/courses(page=${coursePage.number + 1}, keyword=${keyword}, categoryId=${selectedCategoryId}, minPrice=${minPrice}, maxPrice=${maxPrice}, sort=${sort})}" aria-label="Next">
                            <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/notifications.js}"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Ngăn chặn việc tự động đóng menu dropdown/collapse khi click vào checkbox hoặc label bên trong bộ lọc
        const filterElements = document.querySelectorAll('.filter-sidebar .dropdown-menu, .filter-sidebar .accordion-body');
        filterElements.forEach(function(el) {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        });
    });
    </script>
</body>
</html>
