<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách khóa học - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4">Cửa hàng khóa học</h1>
    </div>

    <div class="row">
        <!-- Sidebar Danh mục -->
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-2">
                    <i class="fas fa-folder-tree me-2"></i> Danh mục
                </div>
                <div class="list-group list-group-flush">
                    <a th:href="@{/courses}" class="list-group-item list-group-item-action"
                       th:classappend="${selectedCategoryId == null} ? 'active' : ''">
                        <i class="fas fa-th-large me-2"></i> Tất cả khóa học
                    </a>
                    <th:block th:each="root : ${rootCategories}">
                        <a th:href="@{|/courses?categoryId=${root.id}|}"
                           class="list-group-item list-group-item-action fw-semibold"
                           th:classappend="${selectedCategoryId == root.id} ? 'active' : ''">
                            <i class="fas fa-folder text-warning me-2"></i><span th:text="${root.name}">Cha</span>
                        </a>
                        <a th:each="child : ${root.children}"
                           th:href="@{|/courses?categoryId=${child.id}|}"
                           class="list-group-item list-group-item-action ps-4"
                           th:classappend="${selectedCategoryId == child.id} ? 'active' : ''">
                            <i class="fas fa-folder-open text-secondary me-2"></i><span th:text="${child.name}">Con</span>
                        </a>
                    </th:block>
                </div>
            </div>
        </div>

        <!-- Danh sách khóa học -->
        <div class="col-md-9">
            <div class="row g-3">
                <div class="col-md-6 col-lg-4" th:each="course : ${courses}">
                    <div class="card h-100 shadow-sm border-0">
                        <img th:src="${course.imageUrl != null and !course.imageUrl.isEmpty()} ? ${course.imageUrl} : '/images/default-course.png'"
                             class="card-img-top"
                             style="object-fit: cover; height: 200px; width: 100%;"
                             alt="Ảnh khóa học"
                             onerror="this.src='/images/default-course.png'">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${course.title}">Tên khóa học</h5>
                            <p class="card-text text-muted small" th:text="${#strings.abbreviate(course.description, 120)}">
                                Mô tả khóa học...
                            </p>
                            <p class="fw-bold mb-2 mt-auto">
                                Giá: <span th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</span>
                            </p>
                            <a th:href="@{|/courses/${course.id}|}" class="btn btn-primary btn-sm">Tham gia khóa học</a>
                        </div>
                    </div>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(courses)}" class="text-muted mt-3">Chưa có khóa học nào trong danh mục này.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/notifications.js}"></script>
</body>
</html>
