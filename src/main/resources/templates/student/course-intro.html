<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${course.title} + ' - EduPlus'">Chi tiết khóa học - EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .intro-header-edup { background: var(--gradient-brand); color: #fff; padding: 2rem 0; margin-bottom: 2rem; }
        .intro-title-edup { font-size: clamp(1.35rem, 3vw, 1.75rem); font-weight: 700; line-height: 1.3; }
        .instructor-block-edup { background: var(--edup-surface); border-radius: var(--edup-radius-lg); padding: 1.25rem; border: 1px solid var(--edup-border); }
        .instructor-block-edup .avatar-wrap { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; background: var(--gradient-brand); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 2rem; }
        .instructor-block-edup .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .learn-list-edup { list-style: none; padding-left: 0; }
        .learn-list-edup li { padding: 0.4rem 0; padding-left: 1.75rem; position: relative; }
        .learn-list-edup li::before { content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; left: 0; color: var(--brand-primary); }
        .curriculum-list-edup { background: var(--edup-surface); border: 1px solid var(--edup-border); border-radius: var(--edup-radius-lg); overflow: hidden; }
        .sidebar-sticky-edup .thumb-wrap { height: 200px; background: var(--gradient-brand); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.9); font-size: 4rem; }
        .sidebar-price-edup { font-size: 1.75rem; font-weight: 700; color: var(--accent-teal); }
        .btn-buy-edup { background: var(--gradient-brand); border: none; color: #fff !important; font-weight: 700; padding: 0.9rem 1.5rem; border-radius: 50px; }
        .btn-buy-edup:hover { filter: brightness(1.05); color: #fff !important; box-shadow: 0 4px 20px rgba(236, 72, 153, 0.35); }
        .btn-go-learn-edup { background: var(--gradient-brand); border: none; color: #fff !important; font-weight: 700; padding: 0.9rem 1.5rem; border-radius: 50px; }
        .btn-go-learn-edup:hover { filter: brightness(1.05); color: #fff !important; box-shadow: 0 4px 20px rgba(236, 72, 153, 0.35); }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Header: Video placeholder + Title (Udemy style) -->
    <div class="intro-header-edup" th:style="${course.imageUrl != null and !course.imageUrl.isEmpty()} ? 'background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url(' + ${course.imageUrl} + ') center/cover;' : ''">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8">
                    <div class="ratio ratio-16x9 rounded-3 mb-3 mb-lg-0" style="max-width: 560px; background: rgba(0,0,0,0.3);">
                        <div th:if="${course.imageUrl != null and !course.imageUrl.isEmpty()}" class="d-flex align-items-center justify-content-center">
                            <img th:src="${course.imageUrl}" class="w-100 h-100" style="object-fit: cover; border-radius: 0.5rem;" alt="Ảnh khóa học">
                        </div>
                        <div th:unless="${course.imageUrl != null and !course.imageUrl.isEmpty()}" class="d-flex align-items-center justify-content-center text-white">
                            <i class="fas fa-play-circle fa-4x opacity-75"></i>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <h1 class="intro-title-edup mb-2" th:text="${course.title}">Tên khóa học</h1>
                    <p class="opacity-90 mb-0 small" th:text="${#strings.abbreviate(course.description, 120)}">Mô tả ngắn</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container py-4">
        <div class="mb-3">
            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm rounded-edup"><i class="fas fa-arrow-left me-1"></i> Về trang chủ</a>
        </div>

        <div class="row">
            <!-- Cột trái: Tabs (Mô tả, Nội dung học, Giảng viên) -->
            <div class="col-lg-8 pe-lg-4">
                <ul class="nav nav-tabs-edup nav nav-pills gap-2 mb-4" id="courseIntroTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active rounded-edup" id="tab-desc" data-bs-toggle="pill" data-bs-target="#pane-desc" type="button" role="tab">Mô tả</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-edup" id="tab-curriculum" data-bs-toggle="pill" data-bs-target="#pane-curriculum" type="button" role="tab">Nội dung học</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-edup" id="tab-instructor" data-bs-toggle="pill" data-bs-target="#pane-instructor" type="button" role="tab">Giảng viên</button>
                    </li>
                </ul>
                <div class="tab-content" id="courseIntroTabContent">
                    <div class="tab-pane fade show active" id="pane-desc" role="tabpanel">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body p-4">
                                <h2 class="h5 fw-bold mb-3">Giới thiệu khóa học</h2>
                                <p class="text-muted mb-0" th:text="${course.description}">Mô tả khóa học</p>
                                <h3 class="h6 fw-bold mt-4 mb-2">Bạn sẽ học được gì?</h3>
                                <ul class="learn-list-edup mb-0">
                                    <li th:text="${#strings.abbreviate(course.description, 400)}">Mục tiêu học tập</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="pane-curriculum" role="tabpanel">
                        <div class="card border-0 shadow-sm">
                            <div class="card-body p-0">
                                <div class="list-group list-group-flush curriculum-list-edup">
                                    <div class="list-group-item list-group-item-light fw-semibold">Các bài học</div>
                                    <div th:if="${#lists.isEmpty(lessons)}" class="list-group-item text-muted">Chưa có bài học nào.</div>
                                    <div th:each="lesson, iterStat : ${lessons}" class="list-group-item d-flex align-items-center border-0 border-bottom">
                                        <span class="me-2 text-muted" th:text="${iterStat.count}">1</span>
                                        <span th:text="${lesson.title}">Tên bài học</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="pane-instructor" role="tabpanel">
                        <div class="d-flex align-items-start p-3 border rounded shadow-sm bg-white" th:if="${course.teacher != null}">
                            <img th:src="${(course.teacher.avatar != null and !course.teacher.avatar.isEmpty()) ? course.teacher.avatar : 'https://ui-avatars.com/api/?name=' + course.teacher.fullName + '&size=80&background=0d6efd&color=fff'}"
                                 class="rounded-circle me-3 flex-shrink-0" width="80" height="80" style="object-fit: cover;" alt="Avatar"/>
                            <div>
                                <h5 class="fw-bold mb-1" th:text="${course.teacher.fullName}">Tên GV</h5>
                                <div class="d-flex flex-wrap gap-3 text-muted small mb-3">
                                    <span><i class="fas fa-university me-1"></i> <span th:text="${course.teacher.university != null ? course.teacher.university : 'Đang cập nhật'}">ĐH...</span></span>
                                    <span><i class="fas fa-briefcase me-1"></i> <span th:text="${course.teacher.experience != null ? course.teacher.experience : 'Chưa cập nhật'}">5 năm...</span></span>
                                </div>
                                <p class="mb-0 text-secondary small" style="font-size: 0.95rem;" th:text="${course.teacher.bio != null ? course.teacher.bio : (course.teacher.profile != null ? course.teacher.profile : '')}">Bio giới thiệu...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cột phải: Sticky Sidebar - Mua ngay -->
            <div class="col-lg-4">
                <div class="card sidebar-sticky-edup border-0 shadow">
                    <div class="thumb-wrap" th:style="${course.imageUrl != null and !course.imageUrl.isEmpty()} ? 'background-image: url(' + ${course.imageUrl} + '); background-size: cover; background-position: center;' : ''">
                        <i th:unless="${course.imageUrl != null and !course.imageUrl.isEmpty()}" class="fas fa-graduation-cap"></i>
                    </div>
                    <div class="card-body p-4">
                        <p class="sidebar-price-edup mb-3" th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</p>
                        <div class="d-grid gap-2">
                            <a th:if="${hasEnrollment}" th:href="@{|/student/course/${course.id}|}" class="btn bg-gradient-brand text-white w-100 py-3 rounded-pill fw-bold shadow-sm d-flex align-items-center justify-content-center">
                                <i class="fas fa-play-circle me-2"></i> Vào học ngay
                            </a>
                            <a th:unless="${hasEnrollment}" sec:authorize="isAuthenticated()" th:href="@{|/courses/${course.id}/purchase|}" class="btn btn-buy-edup">
                                <i class="fas fa-shopping-cart me-2"></i>Mua ngay
                            </a>
                            <a th:unless="${hasEnrollment}" sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-buy-edup">
                                <i class="fas fa-lock me-2"></i>Đăng nhập để mua khóa học
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
