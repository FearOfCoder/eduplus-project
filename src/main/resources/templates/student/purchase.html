<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán khóa học - EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow">
                <div class="card-body p-4 rounded-3">
                    <h1 class="h5 mb-3">Thanh toán khóa học</h1>
                    <h2 class="h6 mb-3" th:text="${course.title}">Tên khóa học</h2>
                    <p class="fw-bold mb-3">
                        Giá: <span th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')} + ' VND'">0 VND</span>
                    </p>

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{|/courses/${course.id}/purchase|}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Số thẻ tín dụng (mô phỏng)</label>
                            <input type="text" name="cardNumber" class="form-control" placeholder="4111 1111 1111 1111" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tên in trên thẻ</label>
                            <input type="text" name="cardHolder" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ngày hết hạn</label>
                            <input type="text" name="cardExpiry" class="form-control" placeholder="MM/YY" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Thanh toán</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script th:src="@{/js/notifications.js}"></script>
</body>
</html>
