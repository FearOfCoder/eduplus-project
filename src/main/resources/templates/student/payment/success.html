<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán thành công - EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .success-container {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 0;
        }
        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            box-shadow: 0 8px 24px rgba(40, 167, 69, 0.3);
        }
        .success-icon i {
            font-size: 4rem;
            color: white;
        }
        .teacher-message {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-left: 4px solid #0d6efd;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
        }
        .teacher-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #0d6efd;
        }
        .cta-button {
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="success-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-lg">
                        <div class="card-body p-5 text-center">
                            <!-- Icon thành công -->
                            <div class="success-icon">
                                <i class="fas fa-check"></i>
                            </div>

                            <!-- Tiêu đề -->
                            <h1 class="h3 mb-3 fw-bold">Thanh toán thành công! 🎉</h1>

                            <!-- Nội dung -->
                            <p class="lead text-muted mb-4">
                                Chúc mừng bạn đã sở hữu khóa học <strong th:text="${course.title}">Tên khóa học</strong>.
                            </p>

                            <!-- Lời nhắn từ Giảng viên -->
                            <div class="teacher-message text-start" th:if="${course.teacher != null}">
                                <div class="d-flex align-items-start mb-3">
                                    <div class="me-3">
                                        <img th:if="${course.teacher.avatar != null}" 
                                             th:src="@{'/uploads/' + ${course.teacher.avatar}}" 
                                             alt="Avatar giảng viên" 
                                             class="teacher-avatar"
                                             onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=' + encodeURIComponent('${course.teacher.fullName}') + '&background=0d6efd&color=fff&size=60';">
                                        <div th:unless="${course.teacher.avatar != null}" 
                                             class="teacher-avatar d-flex align-items-center justify-content-center bg-primary text-white fw-bold"
                                             style="font-size: 1.5rem;"
                                             th:text="${#strings.substring(course.teacher.fullName, 0, 1)}">
                                            T
                                        </div>
                                    </div>
                                    <div class="flex-grow-1">
                                        <h5 class="mb-2 fw-bold" th:text="${course.teacher.fullName}">Tên Giảng viên</h5>
                                        <p class="mb-0 text-muted" style="line-height: 1.6;">
                                            <i class="fas fa-quote-left text-primary me-2"></i>
                                            Cảm ơn bạn đã tin tưởng lựa chọn khóa học này. Chúc bạn có những trải nghiệm học tập tuyệt vời và gặt hái được nhiều kiến thức bổ ích!
                                            <i class="fas fa-quote-right text-primary ms-2"></i>
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <!-- Nút CTA -->
                            <div class="d-grid gap-3 d-md-flex justify-content-md-center mt-4">
                                <a th:href="@{'/student/course/' + ${course.id}}" class="btn btn-primary cta-button">
                                    <i class="fas fa-play-circle me-2"></i>
                                    Vào học ngay
                                </a>
                                <a th:href="@{/student/payment-history}" class="btn btn-outline-secondary cta-button">
                                    <i class="fas fa-history me-2"></i>
                                    Xem lịch sử giao dịch
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
