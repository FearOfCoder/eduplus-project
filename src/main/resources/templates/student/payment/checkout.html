<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán khóa học - EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Flat Design - Professional Bank Selection */
        .bank-option {
            border: 1.5px solid #dee2e6;
            border-radius: 6px;
            padding: 20px 15px;
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease;
            text-align: center;
            background-color: #ffffff;
        }
        .bank-option:hover {
            border-color: #0d6efd;
            background-color: #f8f9fa;
        }
        .bank-option input[type="radio"] {
            display: none;
        }
        .bank-option.selected {
            border-color: #0d6efd;
            background-color: #e7f1ff;
        }
        .bank-logo {
            height: 30px;
            width: auto;
            object-fit: contain;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .bank-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: #212529;
            margin-top: 8px;
        }
        .bank-option.selected .bank-name {
            color: #0d6efd;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Thông tin khóa học -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">
                        <h3 class="h5 mb-3">Thông tin khóa học</h3>
                        <div class="d-flex align-items-center">
                            <div class="flex-grow-1">
                                <h4 class="h6 mb-1" th:text="${course.title}">Tên khóa học</h4>
                                <p class="text-muted small mb-0" th:text="${course.description?.substring(0, 100) + '...'}">Mô tả khóa học</p>
                            </div>
                            <div class="text-end">
                                <p class="h5 text-primary mb-0 fw-bold">
                                    <span th:text="${#numbers.formatDecimal(course.price, 0, 'COMMA', 0, 'POINT')}">0</span> VND
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form thanh toán -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="h5 mb-4">Thông tin thanh toán</h3>

                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span th:text="${error}">Lỗi</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form th:action="@{/courses/purchase}" method="post">
                            <input type="hidden" name="courseId" th:value="${course.id}">

                            <!-- Chọn ngân hàng -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold mb-3">Chọn phương thức thanh toán</label>
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <div class="bank-option" onclick="selectBank(this, 'VCB')">
                                            <input type="radio" name="bankCode" id="bank_vcb" value="VCB" required>
                                            <label for="bank_vcb" class="d-block">
                                                <img th:src="@{/images/banks/vcb.png}" alt="Vietcombank" class="bank-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                                <span class="bank-name" style="display:none;">Vietcombank</span>
                                                <span class="bank-name">Vietcombank</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="bank-option" onclick="selectBank(this, 'TCB')">
                                            <input type="radio" name="bankCode" id="bank_tcb" value="TCB" required>
                                            <label for="bank_tcb" class="d-block">
                                                <img th:src="@{/images/banks/tcb.png}" alt="Techcombank" class="bank-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                                <span class="bank-name" style="display:none;">Techcombank</span>
                                                <span class="bank-name">Techcombank</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="bank-option" onclick="selectBank(this, 'MB')">
                                            <input type="radio" name="bankCode" id="bank_mb" value="MB" required>
                                            <label for="bank_mb" class="d-block">
                                                <img th:src="@{/images/banks/mb.png}" alt="MB Bank" class="bank-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                                <span class="bank-name" style="display:none;">MB Bank</span>
                                                <span class="bank-name">MB Bank</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="bank-option" onclick="selectBank(this, 'VISA')">
                                            <input type="radio" name="bankCode" id="bank_visa" value="VISA" required>
                                            <label for="bank_visa" class="d-block">
                                                <img th:src="@{/images/banks/visa.png}" alt="Visa" class="bank-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                                <span class="bank-name" style="display:none;">Visa</span>
                                                <span class="bank-name">Visa</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="bank-option" onclick="selectBank(this, 'MASTERCARD')">
                                            <input type="radio" name="bankCode" id="bank_mc" value="MASTERCARD" required>
                                            <label for="bank_mc" class="d-block">
                                                <img th:src="@{/images/banks/mastercard.png}" alt="Mastercard" class="bank-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                                <span class="bank-name" style="display:none;">Mastercard</span>
                                                <span class="bank-name">Mastercard</span>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="bank-option" onclick="selectBank(this, 'JCB')">
                                            <input type="radio" name="bankCode" id="bank_jcb" value="JCB" required>
                                            <label for="bank_jcb" class="d-block">
                                                <img th:src="@{/images/banks/jcb.png}" alt="JCB" class="bank-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                                <span class="bank-name" style="display:none;">JCB</span>
                                                <span class="bank-name">JCB</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Số thẻ -->
                            <div class="mb-3">
                                <label for="cardNumber" class="form-label fw-semibold">Số thẻ</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="cardNumber" 
                                       name="cardNumber" 
                                       placeholder="4111 1111 1111 1111" 
                                       maxlength="19"
                                       required>
                                <small class="text-muted">Nhập số thẻ bất kỳ để thử nghiệm</small>
                            </div>

                            <!-- Tên chủ thẻ -->
                            <div class="mb-4">
                                <label for="cardHolder" class="form-label fw-semibold">Tên chủ thẻ</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="cardHolder" 
                                       name="cardHolder" 
                                       placeholder="NGUYEN VAN A" 
                                       required>
                            </div>

                            <!-- Nút thanh toán -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-lock me-2"></i>
                                    Thanh toán ngay
                                </button>
                                <a th:href="@{'/courses/' + ${course.id}}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>
                                    Quay lại
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectBank(element, bankCode) {
            // Remove selected class from all bank options
            document.querySelectorAll('.bank-option').forEach(el => {
                el.classList.remove('selected');
            });
            
            // Add selected class to clicked option
            element.classList.add('selected');
            
            // Check the radio button
            const radio = element.querySelector('input[type="radio"]');
            if (radio) {
                radio.checked = true;
            }
        }

        // Format card number input
        document.getElementById('cardNumber')?.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
            e.target.value = formattedValue;
        });
    </script>
</body>
</html>
