<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác thực OTP - EduPlus</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .otp-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .otp-input {
            font-size: 2rem;
            letter-spacing: 0.5rem;
            text-align: center;
            font-weight: 600;
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            width: 100%;
            transition: all 0.3s;
        }
        .otp-input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
            outline: none;
        }
        .email-notice {
            background-color: #e7f1ff;
            border-left: 4px solid #0d6efd;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="otp-container">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-5">
                            <div class="text-center mb-4">
                                <div class="mb-3">
                                    <i class="fas fa-shield-alt text-primary" style="font-size: 3rem;"></i>
                                </div>
                                <h2 class="h4 mb-2">Xác thực thanh toán</h2>
                                <p class="text-muted">Nhập mã OTP để hoàn tất thanh toán</p>
                            </div>

                            <!-- Thông báo email -->
                            <div class="email-notice mb-4">
                                <i class="fas fa-envelope text-primary me-2"></i>
                                <strong>Mã xác thực đã được gửi tới email:</strong>
                                <div class="mt-1" th:text="${user.email}">user@example.com</div>
                            </div>

                            <!-- Thông báo lỗi -->
                            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                <span th:text="${error}">Lỗi</span>
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>

                            <!-- Form nhập OTP -->
                            <form th:action="@{/payment/otp-verify}" method="post">
                                <div class="mb-4">
                                    <label for="otp" class="form-label fw-semibold text-center d-block">Mã OTP (5 chữ số)</label>
                                    <input type="text" 
                                           class="form-control otp-input" 
                                           id="otp" 
                                           name="otp" 
                                           placeholder="00000" 
                                           maxlength="5"
                                           pattern="[0-9]{5}"
                                           required
                                           autocomplete="off"
                                           autofocus>
                                    <small class="text-muted d-block text-center mt-2">
                                        <i class="fas fa-clock me-1"></i>
                                        Mã có hiệu lực trong 10 phút
                                    </small>
                                </div>

                                <!-- Nút xác nhận -->
                                <div class="d-grid gap-2 mb-3">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        <i class="fas fa-check-circle me-2"></i>
                                        Xác nhận
                                    </button>
                                </div>

                                <!-- Nút gửi lại mã -->
                                <div class="text-center">
                                    <button type="button" class="btn btn-link text-decoration-none" onclick="resendOtp()">
                                        <i class="fas fa-redo me-1"></i>
                                        Gửi lại mã
                                    </button>
                                </div>

                                <!-- Quay lại -->
                                <div class="text-center mt-3">
                                    <a th:href="@{/courses}" class="text-decoration-none">
                                        <i class="fas fa-arrow-left me-1"></i>
                                        Quay lại trang chủ
                                    </a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Chỉ cho phép nhập số
        document.getElementById('otp')?.addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });

        // Tự động submit khi nhập đủ 5 số
        document.getElementById('otp')?.addEventListener('input', function(e) {
            if (e.target.value.length === 5) {
                // Có thể tự động submit hoặc để user nhấn nút
                // e.target.form.submit();
            }
        });

        function resendOtp() {
            Swal.fire({
                title: 'Gửi lại mã OTP?',
                text: 'Mã OTP mới sẽ được gửi tới email của bạn.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#0d6efd',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Gửi lại',
                cancelButtonText: 'Hủy'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Redirect về trang checkout để tạo lại OTP
                    window.location.href = '/courses';
                }
            });
        }
    </script>
</body>
</html>
