<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/dashboard-layout :: layout('Bài học khóa học', ~{::content})}">
<body>
    <div th:fragment="content">
<div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-1" th:text="${course.title}">Tên khóa học</h1>
            <p class="mb-0 text-muted">Quản lý bài học</p>
        </div>
    </div>

    <div class="mb-3">
        <a th:href="@{|/teacher/courses/${course.id}/lessons/new|}" class="btn btn-primary btn-sm">
            + Tạo bài học mới
        </a>
    </div>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>Thứ tự</th>
            <th>Tiêu đề</th>
            <th>Loại</th>
            <th>Nội dung</th>
            <th style="width: 200px;">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="l : ${lessons}">
            <td th:text="${l.sortOrder}">1</td>
            <td th:text="${l.title}">Tiêu đề bài học</td>
            <td>
                <span class="badge bg-info" th:text="${l.type}">VIDEO</span>
            </td>
            <td th:text="${#strings.abbreviate(l.content, 80)}">Nội dung...</td>
            <td>
                <div class="d-flex gap-1 flex-wrap">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{|/teacher/lessons/${l.id}/edit|}">
                        Sửa
                    </a>
                    <form th:action="@{|/teacher/lessons/${l.id}/delete|}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Xóa bài học này?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            Xóa
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
    </div>
</body>
</html>
