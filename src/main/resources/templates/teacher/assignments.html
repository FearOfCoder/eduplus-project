<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/dashboard-layout :: layout('Bài tập khóa học', ~{::content})}">
<body>
    <div th:fragment="content">
<div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-1" th:text="${course.title}">Tên khóa học</h1>
            <p class="mb-0 text-muted">Quản lý bài tập</p>
        </div>
    </div>

    <div th:if="${error != null}" class="alert alert-danger mb-3" th:text="${error}"></div>

    <div class="mb-3">
        <a th:href="@{|/teacher/courses/${course.id}/assignments/new|}" class="btn btn-primary btn-sm">
            + Tạo bài tập mới
        </a>
    </div>

    <div th:if="${#lists.isEmpty(assignments)}" class="alert alert-info">
        Khóa học này chưa có bài tập nào. Hãy tạo bài tập mới bằng nút bên trên.
    </div>

    <table th:if="${!#lists.isEmpty(assignments)}" class="table table-striped table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Tiêu đề</th>
            <th>Hạn nộp</th>
            <th>Số bài nộp</th>
            <th style="width: 260px;">Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${assignments}">
            <td th:text="${a.id}">1</td>
            <td th:text="${a.title}">Tiêu đề bài tập</td>
            <td th:text="${a.dueDate != null ? #temporals.format(a.dueDate, 'dd/MM/yyyy HH:mm') : 'Không giới hạn'}">
                01/01/2026 12:00
            </td>
            <td th:text="${#lists.size(a.submissions)}">0</td>
            <td>
                <div class="d-flex gap-1 flex-wrap">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{|/teacher/assignments/${a.id}/edit|}">
                        Sửa
                    </a>
                    <a class="btn btn-sm btn-outline-info"
                       th:href="@{|/teacher/assignments/${a.id}/submissions|}">
                        Bài nộp
                    </a>
                    <form th:action="@{|/teacher/assignments/${a.id}/delete|}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Xóa bài tập sẽ xóa luôn các bài nộp. Tiếp tục?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            Xóa
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>
</div>
    </div>
</body>
</html>
