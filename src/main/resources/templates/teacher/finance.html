<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/dashboard-layout :: layout('Tài chính', ~{::content})}">
<body>
    <div th:fragment="content" class="teacher-finance-page">
        <style>
            .teacher-finance-page .card:hover { transform: none !important; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075) !important; }
        </style>
        <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
        <h1 class="h4 fw-bold mb-4">Tài chính &amp; Rút tiền</h1>

        <div th:if="${withdrawError}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${withdrawError}">Lỗi</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
        </div>
        <div th:if="${param.success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>Yêu cầu rút tiền đã được xử lý thành công.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
        </div>

        <!-- Top Cards - Modern Stat Cards -->
        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <div class="card stat-card-edup h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon-wrap icon-teal">
                            <i class="fas fa-wallet fa-lg"></i>
                        </div>
                        <div>
                            <div class="stat-label mb-1">Số dư khả dụng</div>
                            <div class="stat-value" th:text="|${#numbers.formatDecimal(availableBalance != null ? availableBalance : 0, 0, 'COMMA', 0, 'POINT')} ₫|">0 ₫</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card stat-card-edup h-100">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="stat-icon-wrap icon-primary">
                            <i class="fas fa-chart-line fa-lg"></i>
                        </div>
                        <div>
                            <div class="stat-label mb-1">Tổng doanh thu tích lũy</div>
                            <div class="stat-value" th:text="|${#numbers.formatDecimal(totalRevenue != null ? totalRevenue : 0, 0, 'COMMA', 0, 'POINT')} ₫|">0 ₫</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Layout 4-8: Form | Bảng lịch sử -->
        <div class="row">
            <div class="col-xl-4 col-lg-5 mb-4">
                <div class="card bg-white border-0 rounded-4 shadow-sm">
                    <div class="card-header bg-white border-0 py-3">
                        <h6 class="mb-0 fw-bold">Yêu cầu rút tiền</h6>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/teacher/finance/withdraw}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Ngân hàng</label>
                                <select name="bankName" class="form-select" required>
                                    <option value="">-- Chọn ngân hàng --</option>
                                    <option value="Vietcombank">Vietcombank</option>
                                    <option value="VietinBank">VietinBank</option>
                                    <option value="BIDV">BIDV</option>
                                    <option value="Agribank">Agribank</option>
                                    <option value="Techcombank">Techcombank</option>
                                    <option value="MB Bank">MB Bank</option>
                                    <option value="ACB">ACB</option>
                                    <option value="VP Bank">VP Bank</option>
                                    <option value="TPBank">TPBank</option>
                                    <option value="Sacombank">Sacombank</option>
                                    <option value="HDBank">HDBank</option>
                                    <option value="MSB">MSB</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Số tài khoản</label>
                                <input type="text" name="accountNumber" class="form-control" placeholder="Nhập số tài khoản" required maxlength="20"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tên chủ tài khoản</label>
                                <input type="text" name="accountName" class="form-control" placeholder="Họ tên đúng như ngân hàng" required maxlength="100"/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Số tiền rút (₫)</label>
                                <input type="number" name="amount" class="form-control" placeholder="0" min="0" step="any" required
                                       th:max="${availableBalance != null ? availableBalance : 0}"/>
                                <small class="text-muted">Tối đa: <span th:text="|${#numbers.formatDecimal(availableBalance != null ? availableBalance : 0, 0, 'COMMA', 0, 'POINT')} ₫|">0 ₫</span></small>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Yêu cầu rút tiền</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-xl-8 col-lg-7 mb-4">
                <div class="card table-card-edup">
                    <div class="card-header py-3 border-0" style="background: #F8FAFC;">
                        <h6 class="mb-0 fw-bold">Lịch sử rút tiền</h6>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table id="historyTable" class="table table-hover align-middle w-100 mb-0">
                                <thead>
                                    <tr>
                                        <th>Ngày</th>
                                        <th>Ngân hàng</th>
                                        <th>Số tài khoản</th>
                                        <th class="text-end">Số tiền</th>
                                        <th>Trạng thái</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="w : ${withdrawalHistory}">
                                        <td th:text="${#temporals.format(w.requestDate, 'dd/MM/yyyy HH:mm')}">--</td>
                                        <td th:text="${w.bankName}">--</td>
                                        <td th:text="${w.accountNumber}">--</td>
                                        <td class="text-end" th:attr="data-order=${w.amount != null ? w.amount : 0}" th:text="|${#numbers.formatDecimal(w.amount != null ? w.amount : 0, 0, 'COMMA', 0, 'POINT')} ₫|">0 ₫</td>
                                        <td>
                                            <span th:if="${w.status != null and w.status.name() == 'SUCCESS'}" class="badge rounded-pill badge-status-success">Thành công</span>
                                            <span th:if="${w.status != null and w.status.name() == 'PENDING'}" class="badge rounded-pill badge-status-pending">Chờ duyệt</span>
                                            <span th:if="${w.status != null and w.status.name() == 'REJECTED'}" class="badge rounded-pill badge-status-rejected">Từ chối</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:if="${withdrawalHistory != null and #lists.isEmpty(withdrawalHistory)}" class="p-4 text-muted text-center">Chưa có giao dịch rút tiền.</div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
        <script>
        $.fn.dataTable.ext.order['dom-data-order'] = function (settings, col) {
            return this.api().column(col, { order: 'index' }).nodes().map(function (td) {
                var v = $(td).attr('data-order');
                return v === undefined || v === '' ? 0 : parseFloat(v);
            });
        };
        $(document).ready(function() {
            if ($('#historyTable').length > 0) {
                $('#historyTable').DataTable({
                    "language": {
                        "search": "Tìm kiếm:",
                        "lengthMenu": "Hiển thị _MENU_ giao dịch",
                        "info": "Hiển thị từ _START_ đến _END_ của _TOTAL_ giao dịch",
                        "infoEmpty": "Chưa có giao dịch nào",
                        "zeroRecords": "Không tìm thấy kết quả",
                        "paginate": { "first": "Đầu", "last": "Cuối", "next": "Tiếp", "previous": "Trước" }
                    },
                    "order": [ [ 0, "desc" ] ],
                    "columnDefs": [ { "targets": 3, "orderDataType": "dom-data-order" } ]
                });
            }
        });
        </script>
    </div>
</body>
</html>
