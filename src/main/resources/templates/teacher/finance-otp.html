<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/dashboard-layout :: layout('Xác thực OTP', ~{::content})}">
<body>
    <div th:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3 fw-bold">Xác thực mã OTP</h5>
                        <p class="text-muted small mb-4">Mã OTP đã được gửi đến email của bạn. Vui lòng nhập mã 5 số bên dưới.</p>
                        <div th:if="${param.error != null}" class="alert alert-danger py-2 mb-3">
                            <i class="fas fa-times-circle me-2"></i>Mã OTP không đúng. Vui lòng thử lại.
                        </div>
                        <form th:action="@{/teacher/finance/otp-verify}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Mã OTP (5 số)</label>
                                <input type="text" name="otp" class="form-control form-control-lg text-center" placeholder="00000"
                                       maxlength="5" pattern="[0-9]{5}" required autocomplete="one-time-code"
                                       style="letter-spacing: 0.5rem;"/>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Xác nhận</button>
                            <a th:href="@{/teacher/finance}" class="btn btn-outline-secondary w-100 mt-2">Quay lại Tài chính</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
