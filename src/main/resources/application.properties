# ================== Cấu hình Server ==================
server.port=8080

# ================== Cấu hình Thymeleaf ==================
spring.thymeleaf.cache=false

# ================== Cấu hình MySQL ==================
spring.datasource.url=jdbc:mysql://localhost:3306/lms_ai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ================== Cấu hình Hiển thị Lỗi (Debug) ==================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.whitelabel.enabled=false

# ================== Cấu hình Upload File (Fix lỗi Multipart) ==================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# Để Spring Boot dùng thư mục %TEMP% mặc định của OS (tránh lỗi "path specified" trên Windows).
# spring.servlet.multipart.location=./uploads_temp

# Cấu hình Tomcat (Mở rộng giới hạn nhận dữ liệu)
server.tomcat.max-http-post-size=100MB
server.tomcat.max-swallow-size=100MB

# ================== Đường dẫn lưu file (Custom) ==================
file.upload.dir=uploads
file.avatar.dir=user-photos
file.teacher-docs.dir=uploads/teacher-docs
file.course-images.dir=course-images

